<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tandooribg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#tandooribg)" filter="url(#shadow)"/>
  
  <!-- Tandoor Chicken Pieces -->
  <ellipse cx="70" cy="70" rx="25" ry="35" fill="#D4572E" opacity="0.9"/>
  <ellipse cx="130" cy="80" rx="22" ry="32" fill="#C44F28" opacity="0.85"/>
  <ellipse cx="85" cy="130" rx="28" ry="30" fill="#D4572E" opacity="0.88"/>
  <ellipse cx="130" cy="130" rx="24" ry="28" fill="#C44F28" opacity="0.9"/>
  
  <!-- Char marks -->
  <path d="M 65 60 Q 70 65 75 63" stroke="#8B3A1A" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 125 75 Q 130 80 135 78" stroke="#8B3A1A" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 80 120 Q 85 125 90 123" stroke="#8B3A1A" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Spice garnish -->
  <circle cx="55" cy="85" r="3" fill="#90EE90" opacity="0.7"/>
  <circle cx="145" cy="95" r="3" fill="#90EE90" opacity="0.7"/>
  <circle cx="100" cy="150" r="2.5" fill="#90EE90" opacity="0.6"/>
</svg>