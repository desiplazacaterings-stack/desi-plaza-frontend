<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tikkagrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEFD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD9A8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#tikkagrad)" filter="url(#shadow2)"/>
  
  <!-- Skewer stick -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#8B4513" stroke-width="4"/>
  
  <!-- Tikka pieces on skewer -->
  <circle cx="100" cy="55" r="18" fill="#CD5C5C"/>
  <circle cx="100" cy="80" r="18" fill="#E8907C"/>
  <circle cx="100" cy="105" r="18" fill="#CD5C5C"/>
  <circle cx="100" cy="130" r="18" fill="#E8907C"/>
  <circle cx="100" cy="155" r="16" fill="#CD5C5C"/>
  
  <!-- Highlights on tikka -->
  <ellipse cx="105" cy="50" rx="6" ry="4" fill="#FF9999" opacity="0.7"/>
  <ellipse cx="105" cy="75" rx="6" ry="4" fill="#FFB3B3" opacity="0.7"/>
  <ellipse cx="105" cy="100" rx="6" ry="4" fill="#FF9999" opacity="0.7"/>
  
  <!-- Onion rings between tikka -->
  <circle cx="100" cy="67" r="14" fill="none" stroke="#F5DEB3" stroke-width="3" opacity="0.6"/>
  <circle cx="100" cy="92" r="14" fill="none" stroke="#F5DEB3" stroke-width="3" opacity="0.6"/>
  <circle cx="100" cy="117" r="14" fill="none" stroke="#F5DEB3" stroke-width="3" opacity="0.6"/>
  
  <!-- Cilantro -->
  <path d="M 70 40 Q 65 35 60 40" stroke="#228B22" stroke-width="2" fill="none"/>
  <path d="M 130 40 Q 135 35 140 40" stroke="#228B22" stroke-width="2" fill="none"/>
</svg>